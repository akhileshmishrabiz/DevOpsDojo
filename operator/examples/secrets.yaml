# Example secrets for DevOpsDojo
# In production, use Sealed Secrets, External Secrets, or Vault
apiVersion: v1
kind: Namespace
metadata:
  name: devopsdojo-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: devopsdojo-dev-secrets
  namespace: devopsdojo-dev
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: "your-secure-password-here"
  SECRET_KEY: "your-flask-secret-key-here"
---
apiVersion: v1
kind: Namespace
metadata:
  name: devopsdojo-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: devopsdojo-prod-secrets
  namespace: devopsdojo-prod
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: "your-prod-secure-password"
  SECRET_KEY: "your-prod-flask-secret-key"
